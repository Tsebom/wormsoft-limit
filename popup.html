<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1c1c1c;
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }
    header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    .card { padding: 14px 12px 4px; }
    .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
    .big.ok     { color: #2e7d32; }
    .big.warn   { color: #ef6c00; }
    .big.danger { color: #c62828; }
    .sub { color: #5b6b7c; margin-top: 2px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .row .k { color: #5b6b7c; white-space: nowrap; }
    .row .v { font-weight: 500; text-align: right; }
    .row .v small { color: #5b6b7c; font-weight: 400; }
    .banner {
      margin: 10px 12px 0;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .banner.warn {
      background: #fff4e5;
      border: 1px solid #ffd8a8;
      color: #8a5300;
    }
    .error-box {
      margin: 12px;
      padding: 10px;
      border-radius: 6px;
      background: #fdecea;
      border: 1px solid #f5c6c0;
      color: #8a1f14;
    }
    .error-box a { color: inherit; }
    footer { display: flex; gap: 8px; padding: 10px 12px; }
    button {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary { background: #1565c0; border-color: #1565c0; color: #fff; }
    button:hover { filter: brightness(0.97); }
  </style>
</head>
<body>
  <header>
    <h1>WormSoft лимит</h1>
    <span id="status-dot" title="статус"></span>
  </header>

  <div id="quota-view">
    <div class="card">
      <div id="big" class="big">—</div>
      <div id="sub" class="sub">кредитов осталось (тариф + буст)</div>
    </div>

    <div id="frozen-banner" class="banner warn" style="display:none">
      Подписка заморожена (isFrozen) — действуют лимиты тарифа Free.
    </div>

    <div class="row"><span class="k">По тарифу</span><span class="v" id="subscription">—</span></div>
    <div class="row"><span class="k">Сброс тарифа</span><span class="v" id="sub-reset">—</span></div>
    <div class="row"><span class="k">Буст</span><span class="v" id="boost">—</span></div>
    <div class="row"><span class="k">Конец буста</span><span class="v" id="boost-reset">—</span></div>
    <div class="row"><span class="k">Тариф</span><span class="v" id="sub-type">—</span></div>
    <div class="row"><span class="k">Проверено</span><span class="v" id="lastcheck">—</span></div>
    <div class="row"><span class="k">Следующая проверка</span><span class="v">каждые 5 минут</span></div>
  </div>

  <div id="error-view" class="error-box" style="display:none"></div>

  <footer>
    <button id="refresh" class="primary">Проверить сейчас</button>
    <button id="open-options">⚙ Настройки</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
